name: Build Moblin for Appetize

on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS Simulator
    runs-on: macos-26

    steps:
      - name: Checkout Moblin
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Show environment
        run: |
          uname -m
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes

      - name: Create Moblin user config
        run: |
          mkdir -p Config

          cat > Config/User.xcconfig <<'EOF'
          DEVELOPMENT_TEAM =
          BASE_PRODUCT_BUNDLE_IDENTIFIER = com.viiitaodev.MoblinSimulator
          CAPABILITIES = free
          EOF

          cat Config/User.xcconfig

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project Moblin.xcodeproj \
            -scheme Moblin

      - name: Build Moblin for ARM iOS Simulator
        run: |
          set -o pipefail

          xcodebuild \
            -project Moblin.xcodeproj \
            -scheme Moblin \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            build

      - name: Find Moblin.app
        run: |
          APP_PATH="$PWD/build/Build/Products/Debug-iphonesimulator/Moblin.app"

          echo "APP_PATH=$APP_PATH"

          if [ ! -d "$APP_PATH" ]; then
            echo "Moblin.app do iPhone não encontrado."
            echo "Apps encontrados:"
            find "$PWD/build/Build/Products" -type d -name "*.app" -print
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Check architecture
        run: |
          echo "App: $APP_PATH"

          file "$APP_PATH/Moblin"

          echo ""
          echo "Architectures:"
          lipo -info "$APP_PATH/Moblin" || true

          echo ""
          echo "Bundle:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP_PATH/Info.plist" || true

      - name: Create Appetize ZIP
        run: |
          cd "$(dirname "$APP_PATH")"

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "Moblin.app" \
            "$GITHUB_WORKSPACE/Moblin-Simulator-ARM64.zip"

          cd "$GITHUB_WORKSPACE"

          ls -lh Moblin-Simulator-ARM64.zip

      - name: Upload Moblin Simulator
        uses: actions/upload-artifact@v4
        with:
          name: Moblin-Simulator-ARM64
          path: Moblin-Simulator-ARM64.zip
          retention-days: 7
